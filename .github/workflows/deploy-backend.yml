
name: Deploy GAIUS Nexus Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gaius-core.js'
      - 'gaius-worker.js'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify backend and role regressions
        run: npm test

      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live director registration readiness
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 3 \
            -H 'Origin: https://amanuelnegalign5-dotcom.github.io' \
            -H 'Content-Type: application/json' --data '{}' \
            https://gaius-nexus-api.amanuelnegalign135.workers.dev/info > /tmp/gaius-info.json
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const d=JSON.parse(readFileSync('/tmp/gaius-info.json','utf8')); console.log(JSON.stringify({directorSlots:d.directorSlots,directorMail:d.directorMail})); if(d.directorMail?.international_director!==true) process.exit(1)"

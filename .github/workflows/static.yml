name: Deploy Gaius Nexus to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run all old and new regression tests
        run: npm test
      - name: Verify JavaScript syntax
        run: |
          node --check gaius-core.js
          node --check gaius-v11-core.js
          node --check gaius-app.js
          node --check gaius-v11-ui.js

  deploy-backend:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Cloudflare backend before frontend
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  build:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare frontend-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/icons
          files=(
            index.html manifest.webmanifest sw.js
            gaius-config.js gaius-app.js gaius-store.js gaius-core.js
            gaius-v11-core.js gaius-v11-model.js gaius-v11-ui.js
            gaius-v11-export.js gaius-nexus-analytics.js gaius-v11.css
          )
          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required frontend file missing at repository root: $file"
              exit 1
            fi
            cp "$file" site/
          done
          if ! compgen -G 'icons/*.png' > /dev/null; then
            echo '::error::Missing PWA PNG icons in icons/'
            exit 1
          fi
          cp icons/*.png site/icons/
          if [[ -f icons/official-logo.jpg ]]; then
            cp icons/official-logo.jpg site/icons/
          fi
          touch site/.nojekyll
          echo 'Prepared public frontend files (private/backend sources excluded).'
          find site -maxdepth 2 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy uploaded artifact
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Gaius Nexus to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run all old and new regression tests
        run: npm test
      - name: Verify JavaScript syntax
        run: |
          node --check gaius-core.js
          node --check gaius-v11-core.js
          node --check gaius-app.js
          node --check gaius-v11-ui.js
          node --check gaius-governance-service.js
          node --check gaius-governance-ui.js
          node --check gaius-worker.js

  deploy-backend:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Cloudflare backend before frontend
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live API and browser CORS before publishing frontend
        shell: bash
        run: |
          set -euo pipefail
          api="https://gaius-nexus-api.amanuelnegalign135.workers.dev"
          origin="https://amanuelnegalign5-dotcom.github.io"
          curl --retry 3 --retry-all-errors --max-time 20 -fsS -D /tmp/preflight -o /dev/null -X OPTIONS "$api/info" -H "Origin: $origin" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type,authorization"
          grep -iF "access-control-allow-origin: $origin" /tmp/preflight
          curl --retry 3 --retry-all-errors --max-time 20 -fsS -D /tmp/info-headers -o /tmp/info-body -X POST "$api/info" -H "Origin: $origin" -H "Content-Type: application/json" --data '{}'
          grep -iF "access-control-allow-origin: $origin" /tmp/info-headers
          node -e 'const b=JSON.parse(require("fs").readFileSync("/tmp/info-body","utf8"));if(typeof b.bootstrap!=="boolean")throw Error("Unexpected live API response");console.log("Live API /info verified")'

  build:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare frontend-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/icons
          files=(
            index.html manifest.webmanifest sw.js
            gaius-config.js gaius-offline-vault.js gaius-appearance-help.js gaius-app.js gaius-store.js gaius-core.js gaius-report-policy.js
            gaius-v11-core.js gaius-v11-model.js gaius-v11-ui.js gaius-grant-bridge.js
            gaius-governance-ui.js gaius-department-charters.js
            gaius-v11-export.js gaius-nexus-analytics.js gaius-v11.css gaius-brand.css
          )
          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required frontend file missing at repository root: $file"
              exit 1
            fi
            cp "$file" site/
          done
          if ! compgen -G 'icons/*.png' > /dev/null; then
            echo '::error::Missing PWA PNG icons in icons/'
            exit 1
          fi
          cp icons/*.png site/icons/
          if [[ -f icons/official-logo.jpg ]]; then
            cp icons/official-logo.jpg site/icons/
          fi
          if [[ -f icons/gaius-white-logo.webp ]]; then
            cp icons/gaius-white-logo.webp site/icons/
          fi
          touch site/.nojekyll
          echo 'Prepared public frontend files (private/backend sources excluded).'
          find site -maxdepth 2 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy uploaded artifact
        id: deployment
        uses: actions/deploy-pages@v4
